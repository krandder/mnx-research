<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Redirecting...</h1>
    <p>Please wait...</p>
    
    <script>
        // Get the current path
        const path = window.location.pathname;
        
        // Check if it's the baseurl without trailing slash
        if (path === '/autonomy-evals-guide') {
            window.location.href = 'https://evaluations.metr.org/';
        } else if (path.startsWith('/autonomy-evals-guide/')) {
            // For any other path under autonomy-evals-guide, redirect to equivalent on new domain
            const newPath = path.replace('/autonomy-evals-guide', '');
            window.location.href = 'https://evaluations.metr.org' + newPath;
        } else {
            // Default redirect
            window.location.href = 'https://evaluations.metr.org/';
        }
    </script>
</body>
</html>
